name: schaltwerk

services:
  # PostgreSQL Datenbank
  postgres:
    image: postgres:16-alpine
    container_name: schaltwerk-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-schaltwerk_pro}
    ports:
      - "${DB_PORT:-7002}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - schaltwerk-network

  # Backend API
  backend:
    build:
      context: ./schaltwerk-backend
      dockerfile: Dockerfile
    container_name: schaltwerk-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-schaltwerk_pro}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:7000}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    ports:
      - "7001:3001"
    volumes:
      - ./alte_datenbank:/alte_datenbank:ro
      - backend_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - schaltwerk-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: npm start

  # Frontend Next.js
  frontend:
    build:
      context: ./schaltwerk-pro
      dockerfile: Dockerfile
    container_name: schaltwerk-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:7001}
    ports:
      - "7000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - schaltwerk-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  schaltwerk-network:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:

